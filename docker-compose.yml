services:
  subflare:
    build:
      context: .
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-docker}
    # Prebuilt multi-arch image; `docker compose up -d --build` builds from source instead.
    image: ghcr.io/protonclaw/subflare:latest
    container_name: subflare
    restart: unless-stopped
    ports:
      - "${SUBFLARE_PORT:-8787}:8787"
    environment:
      SUBFLARE_TOKEN: ${SUBFLARE_TOKEN:?set SUBFLARE_TOKEN (login token, at least 8 characters) in .env}
    volumes:
      - subflare-data:/data

volumes:
  subflare-data:
